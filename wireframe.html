<title>계약서 대조 와이어프레임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 왼쪽은 브라우저 틀 안의 실제 화면, 오른쪽은 번호 핀과 짝을 이루는 주석. 900px 아래에서 위아래로 쌓임 */
:root {
  --paper: #f3f4f7;
  --sheet: #ffffff;
  --ink: #1d2230;
  --mute: #697184;
  --line: #c8cdd8;
  --fill: #e9ecf2;
  --note: #2f5bd3;
  --note-bg: #e6ecfc;
  --add-bg: #d9f2e1; --add-fg: #16653a;
  --del-bg: #fbe0e0; --del-fg: #a32222;
  --mod-bg: #ffeeb0; --mod-fg: #6f5200;
  --err-bg: #fdecec;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13161c; --sheet: #1b1f27; --ink: #e5e8ee; --mute: #99a1b0; --line: #3a404d; --fill: #252a34;
    --note: #92b0ff; --note-bg: #22304f;
    --add-bg: #173c27; --add-fg: #93e2b0; --del-bg: #4a1e1e; --del-fg: #ffadad; --mod-bg: #4a3c0e; --mod-fg: #ffd966;
    --err-bg: #3a1c1f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13161c; --sheet: #1b1f27; --ink: #e5e8ee; --mute: #99a1b0; --line: #3a404d; --fill: #252a34;
  --note: #92b0ff; --note-bg: #22304f;
  --add-bg: #173c27; --add-fg: #93e2b0; --del-bg: #4a1e1e; --del-fg: #ffadad; --mod-bg: #4a3c0e; --mod-fg: #ffd966;
  --err-bg: #3a1c1f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px 20px 64px; display: grid; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--note); outline-offset: 2px; }

/* 페이지 머리 */
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--mute); margin: 0; }
h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.3; text-wrap: balance; font-weight: 700; }
.lede { margin: 6px 0 0; color: var(--mute); max-width: 68ch; }

/* 조작 막대 */
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl-label { font-family: var(--font-mono); font-size: 12px; color: var(--mute); margin-right: 4px; }
.seg { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* 브라우저 틀 */
.frame { border: 1.5px solid var(--ink); border-radius: 10px; background: var(--sheet); overflow: hidden; min-width: 0; }
.chrome { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1.5px solid var(--ink); background: var(--fill); }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--mute); display: block; }
.url { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--mute); background: var(--sheet); border: 1px solid var(--line); border-radius: 5px; padding: 2px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.screen { padding: 24px; display: grid; gap: 20px; }
@media (max-width: 520px) { .screen { padding: 16px; } }

/* 핀 */
.pin { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--note); color: var(--sheet); font-family: var(--font-mono); font-size: 11px; font-weight: 500; line-height: 1; vertical-align: middle; }

/* 앱 공통 */
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.logo { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 4px; background: repeating-linear-gradient(45deg, transparent 0 3px, var(--line) 3px 4px); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 6px; padding: 7px 14px; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--ink); color: var(--sheet); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { border-style: dashed; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
.muted { color: var(--mute); }
.small { font-size: 13px; }

/* 화면 1 */
.hero h2 { margin: 0; font-size: 22px; line-height: 1.35; text-wrap: balance; }
.hero p { margin: 4px 0 0; color: var(--mute); }
.slots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 620px) { .slots { grid-template-columns: minmax(0, 1fr); } }
.slot { display: grid; gap: 8px; min-width: 0; }
.slot-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; min-height: 132px; padding: 16px; display: grid; place-items: center; text-align: center; gap: 6px; background: var(--paper); }
.drop .icon { width: 30px; height: 36px; border: 1.5px solid var(--mute); border-radius: 3px; margin: 0 auto 4px; position: relative; }
.drop .icon::after { content: ""; position: absolute; left: 5px; right: 5px; top: 9px; height: 14px; background: repeating-linear-gradient(var(--mute) 0 1.5px, transparent 1.5px 5px); }
.drop.filled { border-style: solid; border-color: var(--ink); place-items: stretch; text-align: left; }
.drop.bad { border-style: solid; border-color: var(--del-fg); background: var(--err-bg); }
.filechip { display: flex; align-items: center; gap: 10px; min-width: 0; }
.filechip .ext { flex: none; font-family: var(--font-mono); font-size: 11px; border: 1.5px solid currentColor; border-radius: 3px; padding: 1px 5px; }
.filechip .name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.ok { color: var(--add-fg); font-size: 13px; }
.errbox { display: grid; gap: 2px; font-size: 14px; }
.errbox strong { color: var(--del-fg); }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.or { color: var(--mute); font-size: 13px; }
.foot { font-size: 13px; color: var(--mute); border-top: 1px dashed var(--line); padding-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* 화면 2 */
.files { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; min-width: 0; }
.files code { font-family: var(--font-mono); font-size: 12.5px; background: var(--fill); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 4px 12px; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 700; }
.chip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.chip.add b { color: var(--add-fg); } .chip.del b { color: var(--del-fg); } .chip.mod b { color: var(--mod-fg); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 13px; color: var(--mute); }
.sw { display: inline-block; padding: 0 5px; border-radius: 3px; color: var(--ink); }
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-family: var(--font-mono); font-weight: 500; color: var(--mute); background: var(--fill); white-space: nowrap; }
tr:last-child > td { border-bottom: 0; }
td.no { white-space: nowrap; font-weight: 600; }
td.no .sub { display: block; font-weight: 400; font-size: 12px; color: var(--mute); }
tr.same td { color: var(--mute); }
ins.a { background: var(--add-bg); color: var(--add-fg); text-decoration: none; padding: 0 2px; border-radius: 2px; }
del.d { background: var(--del-bg); color: var(--del-fg); padding: 0 2px; border-radius: 2px; }
mark.m { background: var(--mod-bg); color: var(--mod-fg); padding: 0 2px; border-radius: 2px; font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tag.added { background: var(--add-bg); color: var(--add-fg); }
.tag.deleted { background: var(--del-bg); color: var(--del-fg); }
.tag.modified { background: var(--mod-bg); color: var(--mod-fg); }
.tag.same { background: var(--fill); color: var(--mute); }
.sumbtn { display: grid; gap: 4px; text-align: left; background: none; border: 0; padding: 0; width: 100%; }
.sumbtn .ai { font-family: var(--font-mono); font-size: 11px; color: var(--note); }
.sumbtn .more { font-size: 12px; color: var(--mute); text-decoration: underline; text-underline-offset: 2px; }
.fail { color: var(--mute); font-style: italic; }
tr.detail td { background: var(--paper); }
.evidence { display: grid; gap: 10px; }
.evidence .warn { font-size: 13px; color: var(--mute); }
.ev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ev-grid > div { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--sheet); min-width: 0; }
.ev-grid h4 { margin: 0 0 4px; font-size: 12px; font-family: var(--font-mono); font-weight: 500; color: var(--mute); }
.ev-grid p { margin: 0; }
.ev-change { font-family: var(--font-mono); font-size: 13px; }
.empty-row { text-align: center; color: var(--mute); padding: 28px; }

/* 주석 */
.notes { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 900px) { .notes { position: static; } }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); padding: 14px 16px; display: grid; gap: 10px; }
.card h3 { margin: 0; font-size: 13px; font-family: var(--font-mono); font-weight: 500; color: var(--mute); letter-spacing: .03em; }
.card ol, .card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.card li { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.5; }
.card li .src { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--mute); margin-top: 2px; }
.card ul li { grid-template-columns: 10px minmax(0, 1fr); }
.card ul li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; border: 1.5px solid var(--mute); }
.map { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 0; }
.map td { padding: 5px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
.map td:last-child { font-family: var(--font-mono); font-size: 12px; color: var(--mute); text-align: right; padding-left: 8px; }

.draft { display: inline-block; font-family: var(--font-mono); font-size: 11px; color: var(--note); border: 1px dashed var(--note); border-radius: 4px; padding: 0 6px; margin-top: 2px; }
.sharehint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--mute); margin-top: -10px; justify-content: flex-end; flex-wrap: wrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border: 1.5px solid var(--del-fg); background: var(--err-bg); border-radius: 8px; font-size: 14px; }
.banner strong { color: var(--del-fg); }
.qgroup { display: grid; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--line); }
.qgroup:first-of-type { border-top: 0; padding-top: 0; }
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.qhead .who { font-family: var(--font-mono); font-size: 11px; color: var(--mute); }
.card .qgroup ul { gap: 4px; }
.card .qgroup li { font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--sheet); padding: 9px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">AI디어 · 계약서 버전 대조와 변경이력 트래킹 · 기준 prd.md v1.1 / handoff.md</p>
    <h1>계약서 대조 도구 와이어프레임</h1>
    <p class="lede">화면은 두 개입니다. 버튼을 누르면 실제처럼 넘어가고, 위의 상태 버튼으로 오류 안내와 요약 실패 화면도 볼 수 있습니다. 파란 번호는 오른쪽 주석과 짝입니다.</p>
  </header>

  <div class="controls" role="toolbar" aria-label="와이어프레임 조작">
    <div class="ctl">
      <span class="ctl-label">화면</span>
      <button class="seg" id="tab-upload" data-screen="upload">1 · 업로드</button>
      <button class="seg" id="tab-result" data-screen="result">2 · 비교 결과</button>
    </div>
    <div class="ctl" id="states"></div>
  </div>

  <div class="main">
    <section class="frame" aria-label="화면 미리보기">
      <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url" id="url"></span></div>
      <div class="screen" id="screen"></div>
    </section>
    <aside class="notes" id="notes"></aside>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const ERRORS = {
  format: { file: '공급계약서_v2.hwp', ext: 'HWP', why: '지원하지 않는 형식이에요.', how: 'docx나 PDF로 올려 주세요.' },
  lock:   { file: '공급계약서_v2.pdf', ext: 'PDF', why: '암호가 걸린 파일이라 열 수 없어요.', how: '암호를 풀고 올려 주세요.' },
  scan:   { file: '공급계약서_v2_스캔본.pdf', ext: 'PDF', why: '글자가 아닌 이미지로 된 PDF라 읽을 수 없어요.', how: '원본 docx나 텍스트 PDF를 올려 주세요.' },
  size:   { file: '공급계약서_v2.pdf · 38MB', ext: 'PDF', why: '파일이 너무 커요.', how: '○MB 이하로 올려 주세요. (한도 미정)' },
  extract:{ file: '공급계약서_v2.pdf', ext: 'PDF', why: '파일에서 글자를 제대로 꺼내지 못했어요.', how: '원본을 docx로 저장해 다시 올려 주세요.', draft: true },
  clause: { file: '공급계약서_v2.docx', ext: 'DOCX', why: '「제N조」 형식의 조항을 찾지 못했어요.', how: '조항 번호가 붙은 계약서인지 확인해 주세요.', draft: true }
};

// 샘플 한 쌍: handoff.md ⑤ 표 기준. seg는 [같은 글자] 또는 [구, 신] 변경 조각
const ROWS = [
  { no: '제1조', title: '목적', status: 'same',
    text: '이 계약은 공급자가 구매자에게 디스플레이 부품을 공급하는 데 필요한 사항을 정함을 목적으로 한다.' },
  { no: '제5조', title: '납기', status: 'modified',
    seg: [['공급자는 발주일로부터 '], ['30일', '20일'], [' 이내에 물품을 납품한다.']],
    summary: '납기가 발주일로부터 30일에서 20일로 10일 짧아졌습니다.' },
  { no: '제9조', title: '지체상금', status: 'modified',
    seg: [['지체일수 1일당 계약금액의 '], ['0.1%', '0.15%'], ['를 지체상금으로 한다.']],
    summary: '지체상금이 하루 계약금액의 0.1%에서 0.15%로 높아졌습니다.' },
  { no: '제12조', title: '비밀유지', status: 'added',
    text: '양 당사자는 이 계약을 이행하며 알게 된 상대방의 기술상·영업상 정보를 상대방의 서면 동의 없이 제3자에게 누설하여서는 아니 된다.' },
  { no: '제13조', oldNo: '제12조', title: '분쟁해결', status: 'same',
    text: '이 계약에 관한 분쟁은 구매자의 본점 소재지를 관할하는 법원을 제1심 관할법원으로 한다.' },
  { no: '제14조', oldNo: '제13조', title: '계약기간', status: 'same',
    text: '이 계약의 기간은 계약일로부터 1년으로 한다.' },
  { oldNo: '제14조', title: '자동연장', status: 'deleted',
    text: '계약기간 만료 1개월 전까지 어느 당사자도 서면으로 해지 의사를 표시하지 않으면 이 계약은 같은 조건으로 1년간 연장된 것으로 본다.' }
];
const LABEL = { added: '추가', deleted: '삭제', modified: '수정', same: '동일' };

const S = { screen: 'upload', oldSlot: 'empty', newSlot: 'empty', summary: 'ok', filter: 'all', open: new Set(['제5조']) };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pin = n => `<span class="pin" aria-label="주석 ${n}">${n}</span>`;

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 2400);
}

/* ---------- 상태 버튼 ---------- */
const UPLOAD_PRESETS = [
  ['empty', '빈 화면', () => { S.oldSlot = 'empty'; S.newSlot = 'empty'; }],
  ['ready', '두 파일 선택됨', () => { S.oldSlot = 'ready'; S.newSlot = 'ready'; }],
  ['format', '오류: 형식', () => { S.oldSlot = 'ready'; S.newSlot = 'format'; }],
  ['lock', '오류: 암호', () => { S.oldSlot = 'ready'; S.newSlot = 'lock'; }],
  ['scan', '오류: 이미지 PDF', () => { S.oldSlot = 'ready'; S.newSlot = 'scan'; }],
  ['size', '오류: 크기', () => { S.oldSlot = 'ready'; S.newSlot = 'size'; }],
  ['extract', '오류: 추출 실패', () => { S.oldSlot = 'ready'; S.newSlot = 'extract'; }],
  ['clause', '오류: 조항 없음', () => { S.oldSlot = 'ready'; S.newSlot = 'clause'; }]
];
const RESULT_PRESETS = [
  ['ok', '기본', () => { S.summary = 'ok'; }],
  ['fail', 'AI 요약 실패', () => { S.summary = 'fail'; }],
  ['sharefail', '공유 링크 저장 실패', () => { S.summary = 'sharefail'; }]
];
function currentPreset() {
  if (S.screen === 'result') return S.summary;
  if (S.oldSlot === 'empty' && S.newSlot === 'empty') return 'empty';
  if (S.oldSlot === 'ready' && S.newSlot === 'ready') return 'ready';
  return ERRORS[S.newSlot] && S.oldSlot === 'ready' ? S.newSlot : null;
}
function renderStates() {
  const list = S.screen === 'upload' ? UPLOAD_PRESETS : RESULT_PRESETS;
  const cur = currentPreset();
  $('#states').innerHTML = `<span class="ctl-label">상태</span>` + list.map(([k, l]) =>
    `<button class="seg" id="st-${k}" data-preset="${k}" aria-pressed="${cur === k}">${l}</button>`).join('');
  $('#states').querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    list.find(p => p[0] === b.dataset.preset)[2](); render();
  });
  ['upload', 'result'].forEach(k => $('#tab-' + k).setAttribute('aria-pressed', S.screen === k));
}

/* ---------- 화면 1 ---------- */
function slotHTML(side) {
  const st = side === 'old' ? S.oldSlot : S.newSlot;
  const label = side === 'old' ? '구버전' : '신버전';
  const file = side === 'old' ? '공급계약서_v1.docx' : '공급계약서_v2.docx';
  let body;
  if (st === 'empty') {
    body = `<div class="drop"><div><div class="icon"></div>
      <div class="small muted">파일을 여기로 끌어다 놓거나</div>
      <button class="btn ghost" id="pick-${side}" data-pick="${side}">${label} 파일 선택</button>
      <div class="small muted">docx · 텍스트 PDF</div></div></div>`;
  } else if (st === 'ready') {
    body = `<div class="drop filled"><div class="filechip"><span class="ext">DOCX</span>
      <span class="name">${file}<br><span class="ok">읽을 수 있는 파일이에요 · 조항 23개</span></span></div>
      <div><button class="linkish" id="clear-${side}" data-clear="${side}">다른 파일로 바꾸기</button></div></div>`;
  } else {
    const e = ERRORS[st];
    body = `<div class="drop filled bad" role="alert"><div class="filechip"><span class="ext">${e.ext}</span><span class="name">${esc(e.file)}</span></div>
      <div class="errbox">${pin(5)}<strong>${e.why}</strong><span>${e.how}</span>${e.draft ? '<span class="draft">문구 초안 · 처리 방법 미정</span>' : ''}</div>
      <div><button class="linkish" id="clear-${side}" data-clear="${side}">다른 파일 올리기</button></div></div>`;
  }
  return `<div class="slot"><div class="slot-head">${side === 'old' ? pin(2) : ''}${label}</div>${body}</div>`;
}
function renderUpload() {
  const ready = S.oldSlot === 'ready' && S.newSlot === 'ready';
  $('#screen').innerHTML = `
    <div class="appbar"><span class="brand"><span class="logo"></span>계약서 대조</span>
      <span class="small muted">${pin(1)} 로그인 없음</span></div>
    <div class="hero"><h2>계약서 두 버전을 올려 주세요</h2>
      <p>조항별로 무엇이 추가·삭제·수정됐는지 비교표로 보여 드려요.</p></div>
    <div class="slots">${slotHTML('old')}${slotHTML('new')}</div>
    <div class="actions">
      ${pin(3)}<button class="btn primary" id="compare" ${ready ? '' : 'disabled'}>비교하기</button>
      <span class="or">또는</span>
      ${pin(4)}<button class="btn" id="sample">샘플 계약서로 체험하기</button>
      <span class="small muted">물품공급계약서 구·신 버전</span>
    </div>
    <div class="foot">올린 파일은 비교가 끝나면 바로 지워요.</div>`;
  $('#screen').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    S[b.dataset.pick + 'Slot'] = 'ready'; render(); });
  $('#screen').querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    S[b.dataset.clear + 'Slot'] = 'empty'; render(); });
  $('#compare').onclick = () => { S.screen = 'result'; render(); };
  $('#sample').onclick = () => { S.screen = 'result'; render(); };
}

/* ---------- 화면 2 ---------- */
function side(seg, which) {
  return seg.map(p => p.length === 1 ? esc(p[0]) : `<mark class="m">${esc(which === 'old' ? p[0] : p[1])}</mark>`).join('');
}
function cells(r) {
  if (r.status === 'modified') return [side(r.seg, 'old'), side(r.seg, 'new')];
  if (r.status === 'added') return ['<span class="muted">—</span>', `<ins class="a">${esc(r.text)}</ins>`];
  if (r.status === 'deleted') return [`<del class="d">${esc(r.text)}</del>`, '<span class="muted">—</span>'];
  return [esc(r.text), esc(r.text)];
}
function summaryCell(r) {
  if (r.status === 'added') return '<span class="muted small">신설 조항</span>';
  if (r.status === 'deleted') return '<span class="muted small">삭제된 조항</span>';
  if (r.status === 'same') return '<span class="muted">—</span>';
  const open = S.open.has(r.no);
  const text = S.summary === 'fail' ? '<span class="fail">요약을 만들지 못했어요</span>' : esc(r.summary);
  return `<button class="sumbtn" id="sum-${r.no}" data-open="${r.no}" aria-expanded="${open}">
    <span class="ai">AI 요약</span><span>${text}</span><span class="more">${open ? '원문 접기 ▴' : '원문 보기 ▾'}</span></button>`;
}
function detailRow(r) {
  const ch = r.seg.filter(p => p.length === 2).map(p =>
    `<del class="d">${esc(p[0])}</del> → <ins class="a">${esc(p[1])}</ins>`).join(', ');
  return `<tr class="detail"><td colspan="5"><div class="evidence">
    <span class="warn">${pin(5)} AI 요약은 틀릴 수 있어요. 아래 원문에서 바뀐 부분을 직접 확인하세요.</span>
    <div class="ev-grid">
      <div><h4>구버전 ${r.no}(${r.title})</h4><p>${side(r.seg, 'old')}</p></div>
      <div><h4>신버전 ${r.no}(${r.title})</h4><p>${side(r.seg, 'new')}</p></div>
    </div>
    <div class="ev-change muted">바뀐 글자: ${ch}</div></div></td></tr>`;
}
function renderResult() {
  const counts = { added: 0, deleted: 0, modified: 0, same: 0 };
  ROWS.forEach(r => counts[r.status]++);
  const rows = ROWS.filter(r => S.filter === 'all' || r.status === S.filter);
  const chip = (k, cls, label, n) =>
    `<button class="chip ${cls}" id="chip-${k}" data-filter="${k}" aria-pressed="${S.filter === k}">${label} <b>${n}</b></button>`;
  const body = rows.length ? rows.map(r => {
    const [o, n] = cells(r);
    const no = r.no
      ? `${r.no}<span class="sub">${r.title}${r.oldNo ? ` · 구 ${r.oldNo}에서 이동` : ''}</span>`
      : `구 ${r.oldNo}<span class="sub">${r.title}</span>`;
    return `<tr class="${r.status}"><td class="no">${no}</td><td>${o}</td><td>${n}</td>
      <td><span class="tag ${r.status}">${LABEL[r.status]}</span></td><td>${summaryCell(r)}</td></tr>`
      + (r.status === 'modified' && S.open.has(r.no) ? detailRow(r) : '');
  }).join('') : `<tr><td colspan="5" class="empty-row">이 종류의 변경은 없어요.</td></tr>`;

  $('#screen').innerHTML = `
    <div class="appbar">
      <div class="files">${pin(1)}<button class="linkish" id="back">← 다시 비교</button>
        <code>공급계약서_v1.docx</code><span class="muted">→</span><code>공급계약서_v2.docx</code></div>
      <div class="tools">${pin(6)}<button class="btn" id="print">인쇄/PDF 저장</button>
        <button class="btn" id="share">공유 링크 복사</button></div>
    </div>
    <div class="sharehint">${pin(8)} 링크가 있으면 누구나 이 결과를 볼 수 있어요 · 보관 기간 미정</div>
    ${S.summary === 'sharefail' ? `<div class="banner" role="alert">${pin(7)}<span><strong>공유 링크를 만들지 못했어요.</strong> 비교 결과는 이 화면에 그대로 있어요. 잠시 뒤 [공유 링크 복사]를 다시 눌러 주세요. <span class="draft">문구 초안</span></span></div>` : ''}
    <div class="chips">${pin(2)}
      ${chip('all', '', '전체', ROWS.length)}
      ${chip('added', 'add', '추가', counts.added)}
      ${chip('deleted', 'del', '삭제', counts.deleted)}
      ${chip('modified', 'mod', '수정', counts.modified)}
      <span class="small muted">동일 ${counts.same}</span>
    </div>
    <div class="legend">${pin(4)}
      <span><ins class="a">추가</ins> 초록</span>
      <span><del class="d">삭제</del> 빨강 취소선</span>
      <span><mark class="m">수정</mark> 바뀐 글자만 노랑</span>
    </div>
    <div class="tablebox">${''}
      <table><thead><tr>
        <th>${pin(3)} 조항</th><th>구버전</th><th>신버전</th><th>구분</th><th>요약</th>
      </tr></thead><tbody>${body}</tbody></table>
    </div>
    ${S.summary === 'fail' ? `<div class="foot">${pin(7)} AI 요약만 실패한 상태입니다. 비교표와 색 표시는 그대로 보여요. <span class="draft">시간 한도 n초 · 다시 시도 버튼 여부 미정</span></div>` : ''}`;

  $('#back').onclick = () => { S.screen = 'upload'; render(); };
  $('#print').onclick = () => toast('실제 앱에서는 비교표가 인쇄 화면으로 열려요 (와이어프레임)');
  $('#share').onclick = () => toast(S.summary === 'sharefail'
    ? '공유 링크를 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.'
    : '공유 링크를 복사했어요 (와이어프레임)');
  $('#screen').querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
    S.filter = (S.filter === b.dataset.filter) ? 'all' : b.dataset.filter; render(); });
  $('#screen').querySelectorAll('[data-open]').forEach(b => b.onclick = () => {
    const k = b.dataset.open; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); });
}

/* ---------- 주석 ---------- */
const NOTES = {
  upload: [
    ['가입 없이 바로 열리는 첫 화면입니다. 로그인·회원 UI는 넣지 않습니다.', 'PRD Q5 · Q4 아예 하지 않을 것'],
    ['구버전·신버전 파일 칸을 나란히 둡니다. 받는 형식은 docx와 텍스트 PDF입니다.', 'PRD Q5 · 한 단락 PRD'],
    ['두 파일이 모두 검사를 통과해야 [비교하기]가 켜집니다.', 'handoff ① 파일 검사'],
    ['샘플을 누르면 업로드 없이 바로 비교 결과 화면이 열립니다. 공개 표준계약서를 고쳐 만든 3쌍 중 하나입니다.', 'PRD Q5 · 필요 데이터'],
    ['읽을 수 없는 파일은 그 칸 안에서 "왜 안 되는지"와 "어떻게 하면 되는지"를 함께 보여 줍니다. 형식·암호·이미지 PDF·크기는 확정 문구이고, 추출 실패와 조항 없음은 처리 방법이 정해지지 않은 초안입니다.', 'handoff ① 안내 문구 표 · 남은 질문 5']
  ],
  result: [
    ['어떤 두 파일을 비교했는지 보여 주고, 업로드 화면으로 돌아갈 수 있습니다.', 'handoff ⑦ files'],
    ['추가·삭제·수정 개수 칩입니다. 누르면 그 종류만 걸러 보이고, 한 번 더 누르면 전체로 돌아갑니다.', 'PRD Q5 · handoff counts'],
    ['조항별 비교표입니다. 번호가 밀린 조항은 제목으로 짝을 맞추고 "구 제12조에서 이동"처럼 표시합니다.', 'handoff ④ 조항 짝 맞추기'],
    ['색 표시는 텍스트 diff 규칙으로 처리합니다. AI를 쓰지 않습니다.', 'PRD Q4-2 · handoff ⑤'],
    ['AI 요약은 "수정" 조항에만 붙습니다. 요약을 누르면 원문 근거가 펼쳐져서 AI가 틀렸는지 바로 확인할 수 있습니다.', 'PRD Q4-3 · 쓰기 전 확인 2'],
    ['인쇄는 비교표를 그대로 출력하고, 공유 링크는 같은 결과 화면 주소를 복사합니다.', 'PRD Q5 · handoff ⑦'],
    ['실패해도 비교표는 남깁니다. AI 요약이 실패하면 요약 칸에 "요약을 만들지 못했어요"가 뜨고, 공유 링크 저장이 실패하면 표 위에 안내가 뜹니다.', 'handoff ⑥ · 남은 질문 5'],
    ['지금은 링크만 있으면 누구나 볼 수 있다고 가정합니다. 링크 만료·삭제 기능이 필요한지는 고객사에 확인할 질문입니다.', 'handoff 남은 질문 2·3']
  ]
};
const OPEN_QUESTIONS = [
  ['원본 형식', '고객사', ['docx·PDF·HWP 중 무엇을 주로 쓰는가. HWP가 주력이면 업로드 안내와 추출 단계가 바뀜']],
  ['저장 위치', '고객사·팀', ['원본 파일을 비교 후 바로 지워도 되는가', '계약서 내용이 외부 클라우드에 머물러도 되는가', '공유 링크 결과 보관 기간']],
  ['권한', '고객사', ['링크만 있으면 누구나 봐도 되는가', '링크 만료·삭제 기능이 필요한가', '가입 없이 쓰는 방식이 보안 정책에 맞는가']],
  ['API·DB', '고객사·팀', ['계약서 문장을 외부 AI API로 보내도 되는가', 'LLM API 종류와 시연 비용 한도', '공유 결과를 저장할 DB (버전 이력 확장 고려)']],
  ['실패 조건', '팀', ['파일 크기 한도', '추출 실패·조항 없음일 때 비교를 계속할지 멈출지', 'AI 요약 시간 한도와 다시 시도 버튼', '공유 링크 저장 실패 문구']]
];
function renderNotes() {
  const list = NOTES[S.screen].map((n, i) =>
    `<li>${pin(i + 1)}<span>${n[0]}<span class="src">${n[1]}</span></span></li>`).join('');
  const data = S.screen === 'result' ? `
    <div class="card"><h3>화면 요소와 데이터</h3>
      <table class="map"><tbody>
        <tr><td>개수 칩</td><td>counts</td></tr>
        <tr><td>비교표, 색 표시</td><td>rows[].old/new/changes/status</td></tr>
        <tr><td>요약, 원문 펼치기</td><td>rows[].summary</td></tr>
        <tr><td>공유 링크</td><td>결과 데이터 저장</td></tr>
      </tbody></table></div>` : '';
  $('#notes').innerHTML = `
    <div class="card"><h3>화면 ${S.screen === 'upload' ? '1 · 업로드' : '2 · 비교 결과'}</h3><ol>${list}</ol></div>
    ${data}
    <div class="card"><h3>남은 질문 · handoff.md</h3>
      ${OPEN_QUESTIONS.map(([t, who, qs]) => `<div class="qgroup">
        <div class="qhead"><b>${t}</b><span class="who">${who}</span></div>
        <ul>${qs.map(q => `<li><span>${q}</span></li>`).join('')}</ul></div>`).join('')}
    </div>`;
}

function render() {
  $('#url').textContent = S.screen === 'upload' ? 'contract-diff.app/' : 'contract-diff.app/result/7f3a2c';
  S.screen === 'upload' ? renderUpload() : renderResult();
  renderStates();
  renderNotes();
}
document.querySelectorAll('[data-screen]').forEach(b => b.onclick = () => { S.screen = b.dataset.screen; render(); });
render();
</script>
